<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Din Coach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <img src="icon-512.png" class="logo" alt="Key of Life" />

  <h1>Din Coach</h1>
  <p class="subtitle">Välj område och få vägledning.</p>
  <div id="today-plan" class="today hidden"></div>

  <div class="language">
    <button id="lang-sv">🇸🇪 Svenska</button>
    <button id="lang-en">🇬🇧 English</button>
  </div>

  <div class="categories">
    <button onclick="selectCategory('stress')">😔 Stress</button>
    <button onclick="selectCategory('relation')">❤️ Relation</button>
    <button onclick="selectCategory('energi')">⚡ Energi</button>
    <button onclick="selectCategory('självkänsla')">🌱 Självkänsla</button>
    <button onclick="selectCategory('ekonomi')">💰 Ekonomi</button>
    <button onclick="selectCategory('utveckling')">🚀 Personlig utveckling</button>
  </div>

  <!-- ÖVNINGSKORT -->
  <div id="exercise-card" class="card hidden">
    <h3 id="card-title"></h3>
    <div id="progress"></div>
    <p id="card-text"></p>
    <button id="next-btn">Nästa övning</button>
    <textarea id="input" placeholder="Skriv din reflektion här..."></textarea>
    <button onclick="send()">Spara svar</button>
  </div>

  <!-- PÅMINNELSER -->
  <div class="nav">
    <button onclick="enableReminders()">🔔 Aktivera påminnelser</button>
    <button onclick="scheduleDaily()">⏰ Daglig påminnelse</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
