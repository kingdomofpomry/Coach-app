<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Din Coach</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="app">
<img src="icon-512.png" class="logo" />

  <h1>Key Clarity</h1>
  <div id="streak"></div>
  <div id="last-answer" class="card hidden"></div>
 <p class="subtitle">
Make better decisions. Improve your finances. Take control.
</p>

  <!-- 🌍 SPRÅK -->
  <div class="language">
    <button onclick="setLanguage('sv')">🇸🇪 Svenska</button>
    <button onclick="setLanguage('en')">🇬🇧 English</button>
  </div>

  <!-- 📊 KATEGORIER -->
  <div class="categories">

  <button id="cat-finance" onclick="selectCategory('finance')">
    💰 Finance
  </button>

  <button id="cat-bills" onclick="selectCategory('bills')">
    📄 Bills
  </button>

  <button id="cat-spending" onclick="selectCategory('spending')">
    💳 Spending
  </button>

  <button id="cat-save" onclick="selectCategory('saving')">
    📈 Save
  </button>

  <button id="cat-decisions" onclick="selectCategory('mind')">
    🧠 Decisions
  </button>

</div>

  <!-- 🧠 ÖVNING -->
  <div id="exercise-card" class="card hidden">

    <h3 id="card-title"></h3>
    <div id="progress"></div>
    <p id="card-text"></p>

    <textarea id="input" placeholder="Skriv din reflektion..."></textarea>

    <!-- 🔥 KNAPPAR -->
    <button onclick="send()">Få AI-reflektion</button>
    <button onclick="nextExercise()">Nästa övning</button>

    <!-- 🧠 AI SVAR -->
    <div id="ai-response" class="hidden"></div>

  </div>

  <!-- 🔔 PÅMINNELSER -->
  <div class="nav">
    <button onclick="enableReminders()">🔔 Aktivera påminnelser</button>
    <button onclick="scheduleDaily()">⏰ Daglig påminnelse</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
function updateStreakUI() {
  const el = document.getElementById("streak");
  const streak = getStreak();

  el.innerText = currentLanguage === "sv"
    ? `🔥 Streak: ${streak} dagar`
    : `🔥 Streak: ${streak} days`;
}
