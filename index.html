<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Din Coach</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="app">

  <h1>Din Coach</h1>
  <p class="subtitle">Välj område och få vägledning.</p>

  <!-- 🌍 SPRÅK -->
  <div class="language">
    <button onclick="setLanguage('sv')">🇸🇪 Svenska</button>
    <button onclick="setLanguage('en')">🇬🇧 English</button>
  </div>

  <!-- 📊 KATEGORIER -->
  <div class="categories">
    <button onclick="selectCategory('stress')">😔 Stress</button>
    <button onclick="selectCategory('relation')">❤️ Relation</button>
    <button onclick="selectCategory('energi')">⚡ Energi</button>
    <button onclick="selectCategory('självkänsla')">🌱 Självkänsla</button>
    <button onclick="selectCategory('ekonomi')">💰 Ekonomi</button>
    <button onclick="selectCategory('utveckling')">🚀 Personlig utveckling</button>
  </div>

  <!-- 🧠 ÖVNING -->
  <div id="exercise-card" class="card hidden">

    <h3 id="card-title"></h3>
    <div id="progress"></div>
    <p id="card-text"></p>

    <textarea id="input" placeholder="Skriv din reflektion..."></textarea>

    <!-- 🔥 KNAPPAR -->
    <button onclick="send()">Få AI-reflektion</button>
    <button onclick="nextExercise()">Nästa övning</button>

    <!-- 🧠 AI SVAR -->
    <div id="ai-response" class="hidden"></div>

  </div>

  <!-- 🔔 PÅMINNELSER -->
  <div class="nav">
    <button onclick="enableReminders()">🔔 Aktivera påminnelser</button>
    <button onclick="scheduleDaily()">⏰ Daglig påminnelse</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
